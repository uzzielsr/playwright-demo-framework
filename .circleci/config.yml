version: 2.1
orbs:
  node: circleci/node@5

jobs:
  test-node:
    executor: node/default
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: 🎭 Install Playwright browsers
          command: npx playwright install chromium --with-deps

      # 1️⃣ Create auth.json
      - run:
          name: 🐳 Setup Magento auth.json
          command: |
            sudo apt-get update && sudo apt-get install -y bc
            mkdir -p ~/Sites/magento
            cd ~/Sites/magento

            # Create global composer auth
            mkdir -p ~/.composer
            cat > ~/.composer/auth.json \<<EOF
            {
                "http-basic": {
                    "repo.magento.com": {
                        "username": "${MAGENTO_PUBLIC_KEY}",
                        "password": "${MAGENTO_PRIVATE_KEY}"
                    }
                }
            }
            EOF

            # Also create local auth for the project
            mkdir -p auth
            cp ~/.composer/auth.json auth/auth.json

      # 2️⃣ Debug auth.json
      - run:
          name: 🔍 Debug auth.json
          command: |
            echo "🔍 Verifying authentication setup..."

            # Check if auth.json exists
            if [ -f ~/.composer/auth.json ]; then
              echo "✅ Global auth.json exists at ~/.composer/auth.json"
              # Show structure without revealing credentials
              echo "📋 Auth.json structure:"
              cat ~/.composer/auth.json | sed 's/"[^"]*"/"***"/g' | head -n 10
            else
              echo "❌ Global auth.json missing at ~/.composer/"
              exit 1
            fi

            # Check if local auth exists
            if [ -f auth/auth.json ]; then
              echo "✅ Local auth.json backup exists"
            else
              echo "⚠️ Local auth.json backup not found (this is optional)"
            fi

            # Verify environment variables are set (without showing values)
            if [ -n "${MAGENTO_PUBLIC_KEY}" ]; then
              echo "✅ MAGENTO_PUBLIC_KEY is set"
            else
              echo "❌ MAGENTO_PUBLIC_KEY is not set"
            fi

            if [ -n "${MAGENTO_PRIVATE_KEY}" ]; then
              echo "✅ MAGENTO_PRIVATE_KEY is set"
            else
              echo "❌ MAGENTO_PRIVATE_KEY is not set"
            fi

      # 3️⃣ Install Magento
      - run:
          name: 🐳 Install Magento with Docker
          command: |
            cd ~/Sites/magento

            # Verify auth.json is accessible
            echo "🔍 Verifying auth.json setup..."
            if [ ! -f ~/.composer/auth.json ]; then
              echo "❌ auth.json not found in ~/.composer/"
              exit 1
            fi

            # Show auth.json structure (masked)
            echo "✅ auth.json exists and contains:"
            cat ~/.composer/auth.json | jq -r 'keys[]' || echo "Structure validation passed"

            # Ensure we have the required credentials
            if [ -z "${MAGENTO_PUBLIC_KEY}" ] || [ -z "${MAGENTO_PRIVATE_KEY}" ]; then
              echo "❌ MAGENTO_PUBLIC_KEY or MAGENTO_PRIVATE_KEY environment variables are not set"
              exit 1
            fi

            # Download and setup the docker environment first
            echo "🚀 Setting up Docker environment..."
            curl -s https://raw.githubusercontent.com/markshust/docker-magento/master/lib/template | bash

            # Now we need to provide credentials to the installation process
            # The onelinesetup script expects credentials interactively, so we'll use expect
            sudo apt-get install -y expect

            # Create an expect script to provide credentials automatically
            cat > install_magento.exp <<EOF
#!/usr/bin/expect -f
set timeout 300
spawn ./bin/download community 2.4.8
expect "Username:" { send "${MAGENTO_PUBLIC_KEY}\r" }
expect "Password:" { send "${MAGENTO_PRIVATE_KEY}\r" }
expect eof
EOF

            chmod +x install_magento.exp

            echo "🚀 Starting Magento installation with automated credentials..."
            ./install_magento.exp

            # Setup the domain after download
            ./bin/setup magento.test

            echo "⏳ Waiting for Magento installation to complete..."
            sleep 60

            # Verify installation
            if [ ! -f "bin/magento" ]; then
              echo "❌ Magento installation failed - bin/magento not found"
              echo "📋 Directory contents:"
              ls -la
              echo "📋 Checking Docker logs:"
              docker compose logs --tail=100 || echo "No docker compose logs available"
              exit 1
            fi

            echo "✅ Magento installation completed successfully"
            bin/magento sampledata:deploy
            bin/magento setup:upgrade
            bin/magento config:set customer/captcha/enable 0
            bin/magento config:set admin/captcha/enable 0
            bin/magento cache:clean
            bin/magento cache:flush
            echo "✅ Using default admin credentials: john.smith / password123"
            echo "127.0.0.1 magento.test" | sudo tee -a /etc/hosts

      # 4️⃣ Wait for Magento to be ready
      - run:
          name: ⏳ Wait for Magento to be ready
          command: |
            cd ~/Sites/magento
            echo "Waiting for containers to be healthy..."
            timeout 300 bash -c 'until docker compose ps | grep -q "Up (healthy)" || docker compose ps | grep -q "Up"; do sleep 10; echo "Still waiting for containers..."; done'

            echo "Waiting for Magento frontend to respond..."
            timeout 300 bash -c 'until curl -k -s -o /dev/null -w "%{http_code}" https://magento.test | grep -q "200\\|302"; do sleep 10; echo "Still waiting for Magento frontend..."; done'

            echo "✅ Magento is ready at https://magento.test"

      # 5️⃣ Create .env file
      - run:
          name: 🛠️ Create .env file
          command: |
            echo "BASE_URL=https://magento.test" >> .env
            echo "TEST_EMAIL=$TEST_EMAIL" >> .env
            echo "TEST_PASSWORD=$TEST_PASSWORD" >> .env
            echo "ADMIN_USERNAME=$ADMIN_USERNAME" >> .env
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> .env
            echo "MAGENTO_PUBLIC_KEY=$MAGENTO_PUBLIC_KEY" >> .env
            echo "MAGENTO_PRIVATE_KEY=$MAGENTO_PRIVATE_KEY" >> .env
            echo "INVALID_EMAIL=$INVALID_EMAIL" >> .env
            echo "INVALID_PASSWORD=$INVALID_PASSWORD" >> .env

      # 6️⃣ Run tests
      - run:
          name: 🧪 Run Playwright tests
          command: npx playwright test --project=chromium --reporter=list

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: deploy
          command: "#e.g. ./deploy.sh"
      - run:
          name: found github actions config
          command: ":"

workflows:
  build-and-test:
    jobs:
      - test-node