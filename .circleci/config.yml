version: 2.1
orbs:
  node: circleci/node@5

jobs:
  test-node:
    executor: node/default
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: 🎭 Install Playwright browsers
          command: npx playwright install chromium --with-deps

      # 1️⃣ Create auth.json
      - run:
          name: 🐳 Setup Magento auth.json
          command: |
            sudo apt-get update && sudo apt-get install -y bc
            mkdir -p ~/Sites/magento
            cd ~/Sites/magento

            mkdir -p ~/.composer
            cat > ~/.composer/auth.json \<<EOF
            {
                "http-basic": {
                    "repo.magento.com": {
                        "username": "${MAGENTO_PUBLIC_KEY}",
                        "password": "${MAGENTO_PRIVATE_KEY}"
                    }
                }
            }
            EOF

      # 2️⃣ Debug auth.json
      - run:
          name: 🔍 Debug auth.json
          command: |
            if [ -f ~/.composer/auth.json ]; then
              echo "✅ auth.json exists"
              head -n 5 ~/.composer/auth.json | sed 's/[A-Za-z0-9]/*/g'
            else
              echo "❌ auth.json missing"
              exit 1
            fi

      # 3️⃣ Install Magento
      - run:
          name: 🐳 Install Magento with Docker
          command: |
            cd ~/Sites/magento
            curl -s https://raw.githubusercontent.com/markshust/docker-magento/master/lib/onelinesetup | bash -s -- magento.test community 2.4.8

            echo "Waiting for Magento installation to complete..."
            sleep 60

            if [ ! -f "bin/magento" ]; then
              echo "❌ Magento installation failed - bin/magento not found"
              ls -la
              docker compose logs --tail=50 || echo "No docker compose logs available"
              exit 1
            fi

            echo "✅ Magento installation completed successfully"
            bin/magento sampledata:deploy
            bin/magento setup:upgrade
            bin/magento config:set customer/captcha/enable 0
            bin/magento config:set admin/captcha/enable 0
            bin/magento cache:clean
            bin/magento cache:flush
            echo "✅ Using default admin credentials: john.smith / password123"
            echo "127.0.0.1 magento.test" | sudo tee -a /etc/hosts

      # 4️⃣ Wait for Magento to be ready
      - run:
          name: ⏳ Wait for Magento to be ready
          command: |
            cd ~/Sites/magento
            echo "Waiting for containers to be healthy..."
            timeout 300 bash -c 'until docker compose ps | grep -q "Up (healthy)" || docker compose ps | grep -q "Up"; do sleep 10; echo "Still waiting for containers..."; done'

            echo "Waiting for Magento frontend to respond..."
            timeout 300 bash -c 'until curl -k -s -o /dev/null -w "%{http_code}" https://magento.test | grep -q "200\\|302"; do sleep 10; echo "Still waiting for Magento frontend..."; done'

            echo "✅ Magento is ready at https://magento.test"

      # 5️⃣ Create .env file
      - run:
          name: 🛠️ Create .env file
          command: |
            echo "BASE_URL=https://magento.test" >> .env
            echo "TEST_EMAIL=$TEST_EMAIL" >> .env
            echo "TEST_PASSWORD=$TEST_PASSWORD" >> .env
            echo "ADMIN_USERNAME=$ADMIN_USERNAME" >> .env
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> .env
            echo "MAGENTO_PUBLIC_KEY=$MAGENTO_PUBLIC_KEY" >> .env
            echo "MAGENTO_PRIVATE_KEY=$MAGENTO_PRIVATE_KEY" >> .env
            echo "INVALID_EMAIL=$INVALID_EMAIL" >> .env
            echo "INVALID_PASSWORD=$INVALID_PASSWORD" >> .env

      # 6️⃣ Run tests
      - run:
          name: 🧪 Run Playwright tests
          command: npx playwright test --project=chromium --reporter=list

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: deploy
          command: "#e.g. ./deploy.sh"
      - run:
          name: found github actions config
          command: ":"

workflows:
  build-and-test:
    jobs:
      - test-node