name: Magento E2E Tests

on:
  schedule:
    - cron: "0 11 * * *"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

run-name: "Magento E2E – ${{ github.event_name }} – Run #${{ github.run_number }}"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: 🐳 Setup Magento with Docker
        run: |
          # Create your project directory then go into it (siguiendo la documentación oficial)
          mkdir -p ~/Sites/magento
          cd ~/Sites/magento
          
          # Create auth.json with Magento credentials before installation
          mkdir -p ~/.composer
          cat > ~/.composer/auth.json << EOF
          {
              "http-basic": {
                  "repo.magento.com": {
                      "username": "${{ secrets.MAGENTO_PUBLIC_KEY }}",
                      "password": "${{ secrets.MAGENTO_PRIVATE_KEY }}"
                  }
              }
          }
          EOF
          
          # Run this automated one-liner from the directory you want to install your project.
          curl -s https://raw.githubusercontent.com/markshust/docker-magento/master/lib/onelinesetup | bash -s -- magento.test community 2.4.8
          
          # Wait for installation to complete
          echo "Waiting for Magento installation to complete..."
          sleep 60
          
          # Verify bin/magento exists
          if [ ! -f "bin/magento" ]; then
            echo "❌ Magento installation failed - bin/magento not found"
            echo "📋 Listing directory contents:"
            ls -la
            echo "📋 Checking for errors in logs:"
            docker compose logs --tail=50
            exit 1
          fi
          
          echo "✅ Magento installation completed successfully"
          
          # Install sample data
          bin/magento sampledata:deploy
          bin/magento setup:upgrade
          
          # No need to create custom admin user - using default credentials:
          # Username: john.smith
          # Password: password123
          echo "✅ Using default admin credentials: john.smith / password123"
          
          # Configure hosts for magento.test
          echo "127.0.0.1 magento.test" | sudo tee -a /etc/hosts

      - name: ⏳ Wait for Magento to be ready
        run: |
          cd ~/Sites/magento
          
          # Wait for containers to be healthy
          echo "Waiting for containers to be healthy..."
          timeout 300 bash -c 'until docker compose ps | grep -q "Up (healthy)" || docker compose ps | grep -q "Up"; do sleep 10; echo "Still waiting for containers..."; done'
          
          # Wait for Magento frontend to respond
          echo "Waiting for Magento frontend to respond..."
          timeout 300 bash -c 'until curl -k -s -o /dev/null -w "%{http_code}" https://magento.test | grep -q "200\|302"; do sleep 10; echo "Still waiting for Magento frontend..."; done'
          
          echo "✅ Magento is ready at https://magento.test"

      - name: 🛠️ Create .env file
        run: |
          echo "BASE_URL=https://magento.test" >> .env
          echo "TEST_EMAIL=${{ secrets.TEST_EMAIL }}" >> .env
          echo "TEST_PASSWORD=${{ secrets.TEST_PASSWORD }}" >> .env
          echo "ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}" >> .env
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
          echo "MAGENTO_PUBLIC_KEY=${{ secrets.MAGENTO_PUBLIC_KEY }}" >> .env
          echo "MAGENTO_PRIVATE_KEY=${{ secrets.MAGENTO_PRIVATE_KEY }}" >> .env
          echo "INVALID_EMAIL=${{ secrets.INVALID_EMAIL }}" >> .env
          echo "INVALID_PASSWORD=${{ secrets.INVALID_PASSWORD }}" >> .env

      - name: 🧪 Run Playwright tests
        run: npm run test

      - name: 📸 Upload test-results (screenshots/videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: 📂 Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
