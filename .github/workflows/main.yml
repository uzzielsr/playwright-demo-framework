name: Magento E2E Tests

on:
  schedule:
    - cron: "0 11 * * *"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

run-name: "Magento E2E – ${{ github.event_name }} – Run #${{ github.run_number }}"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: 🐳 Setup Magento with Docker
        run: |
          # Create your project directory then go into it (siguiendo la documentación oficial)
          mkdir -p ~/Sites/magento
          cd ~/Sites/magento

          # Create auth.json with Magento credentials before installation
          mkdir -p ~/.composer
          cat > ~/.composer/auth.json << EOF
          {
              "http-basic": {
                  "repo.magento.com": {
                      "username": "${{ secrets.MAGENTO_PUBLIC_KEY }}",
                      "password": "${{ secrets.MAGENTO_PRIVATE_KEY }}"
                  }
              }
          }
          EOF

          # Run this automated one-liner from the directory you want to install your project.
          curl -s https://raw.githubusercontent.com/markshust/docker-magento/master/lib/onelinesetup | bash -s -- magento.test community 2.4.8

          # Wait for installation to complete
          echo "Waiting for Magento installation to complete..."
          sleep 60

          # Verify bin/magento exists
          if [ ! -f "bin/magento" ]; then
            echo "❌ Magento installation failed - bin/magento not found"
            echo "📋 Listing directory contents:"
            ls -la
            echo "📋 Checking for errors in logs:"
            docker compose logs --tail=50
            exit 1
          fi

          echo "✅ Magento installation completed successfully"

          # Install sample data
          bin/magento sampledata:deploy
          bin/magento setup:upgrade

          # Disable CAPTCHA for testing
          echo "🔧 Disabling CAPTCHA for E2E testing..."
          bin/magento config:set customer/captcha/enable 0
          bin/magento config:set admin/captcha/enable 0
          bin/magento cache:clean
          bin/magento cache:flush

          # No need to create custom admin user - using default credentials:
          # Username: john.smith
          # Password: password123
          echo "✅ Using default admin credentials: john.smith / password123"

          # Configure hosts for magento.test
          echo "127.0.0.1 magento.test" | sudo tee -a /etc/hosts

      - name: ⏳ Wait for Magento to be ready
        run: |
          cd ~/Sites/magento

          # Wait for containers to be healthy
          echo "Waiting for containers to be healthy..."
          timeout 300 bash -c 'until docker compose ps | grep -q "Up (healthy)" || docker compose ps | grep -q "Up"; do sleep 10; echo "Still waiting for containers..."; done'

          # Wait for Magento frontend to respond
          echo "Waiting for Magento frontend to respond..."
          timeout 300 bash -c 'until curl -k -s -o /dev/null -w "%{http_code}" https://magento.test | grep -q "200\|302"; do sleep 10; echo "Still waiting for Magento frontend..."; done'

          echo "✅ Magento is ready at https://magento.test"

      - name: � Configure Magento for API testing
        run: |
          cd ~/Sites/magento

          # Disable Two-Factor Authentication modules for API testing (order matters due to dependencies)
          echo "🔓 Disabling Two-Factor Authentication modules for testing..."
          bin/magento module:disable Magento_AdminAdobeImsTwoFactorAuth
          bin/magento module:disable Magento_TwoFactorAuth
          bin/magento cache:flush

          echo "✅ Two-Factor Authentication disabled for API testing"

      - name: 🔧 Create CI environment file
        run: |
          cat > .env.ci << EOF
          TESTRAIL_HOST=${{ secrets.TESTRAIL_HOST }}
          TESTRAIL_USER=${{ secrets.TESTRAIL_USER }}
          TESTRAIL_PASSWORD=${{ secrets.TESTRAIL_PASSWORD }}
          TESTRAIL_PROJECT_ID=${{ secrets.TESTRAIL_PROJECT_ID }}
          TESTRAIL_SUITE_ID=${{ secrets.TESTRAIL_SUITE_ID }}

          TESTMO_URL=${{ secrets.TESTMO_URL }}
          TESTMO_TOKEN=${{ secrets.TESTMO_TOKEN }}
          TESTMO_PROJECT_ID=${{ secrets.TESTMO_PROJECT_ID }}

          BASE_URL=${{ secrets.BASE_URL || 'https://magento.test' }}
          TEST_EMAIL=${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD=${{ secrets.TEST_PASSWORD }}
          TEST_FIRST_NAME=${{ secrets.TEST_FIRST_NAME }}
          TEST_LAST_NAME=${{ secrets.TEST_LAST_NAME }}
          TEST_EMAIL_DOMAIN=${{ secrets.TEST_EMAIL_DOMAIN }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          MAGENTO_PUBLIC_KEY=${{ secrets.MAGENTO_PUBLIC_KEY }}
          MAGENTO_PRIVATE_KEY=${{ secrets.MAGENTO_PRIVATE_KEY }}
          MAGENTO_WEBSITE_ID=${{ secrets.MAGENTO_WEBSITE_ID }}
          MAGENTO_STORE_ID=${{ secrets.MAGENTO_STORE_ID }}
          MAGENTO_GROUP_ID=${{ secrets.MAGENTO_GROUP_ID }}
          INVALID_EMAIL=${{ secrets.INVALID_EMAIL }}
          INVALID_PASSWORD=${{ secrets.INVALID_PASSWORD }}
          EOF
          echo "✅ CI environment file created"

      - name: 🧪 Run Playwright tests
        run: ENV=ci npx playwright test --project=chromium --reporter=list

      - name: 📸 Upload test-results (screenshots/videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: 📂 Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/