name: Magento E2E Tests

on:
  schedule:
    - cron: "0 11 * * *"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

run-name: "Magento E2E – ${{ github.event_name }} – Run #${{ github.run_number }}"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps

      - name: 🐳 Setup Magento with Docker
        run: |
          # Create magento directory
          mkdir -p ~/magento
          cd ~/magento
          
          # Install Magento using Mark Shust's one-liner
          curl -s https://raw.githubusercontent.com/markshust/docker-magento/master/lib/onelinesetup | bash -s -- magento.test community 2.4.8
          
          # Install sample data
          bin/magento sampledata:deploy
          bin/magento setup:upgrade
          
          # Configure hosts for magento.test
          echo "127.0.0.1 magento.test" | sudo tee -a /etc/hosts

      - name: ⏳ Wait for Magento to be ready
        run: |
          cd ~/magento
          
          # Wait for containers to be healthy
          timeout 300 bash -c 'until docker-compose ps | grep -q "Up (healthy)"; do sleep 10; echo "Waiting for Magento..."; done'
          
          # Wait for Magento frontend to respond
          timeout 180 bash -c 'until curl -k -s https://magento.test > /dev/null; do sleep 5; echo "Waiting for Magento frontend..."; done'
          
          echo "✅ Magento is ready at https://magento.test"

      - name: 🛠️ Create .env file
        run: |
          echo "BASE_URL=https://magento.test" >> .env
          echo "TEST_EMAIL=john.smith@gmail.com" >> .env
          echo "TEST_PASSWORD=password123" >> .env
          echo "INVALID_EMAIL=invalid@example.com" >> .env
          echo "INVALID_PASSWORD=wrongpassword" >> .env

      - name: 🧪 Run Playwright tests
        run: npm run test

      - name: 📸 Upload test-results (screenshots/videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: 📂 Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
